name: Build ExploreFilter

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-v2

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Install ldid
        run: brew install ldid

      - name: Build debug (logging enabled)
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1 EF_LOGGING=1
          cp .theos/obj/arm64/ExploreFilter.dylib ExploreFilter-debug.dylib

      - name: Build release (logging disabled)
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1 EF_LOGGING=0
          cp .theos/obj/arm64/ExploreFilter.dylib ExploreFilter-release.dylib

      - name: Upload debug dylib
        uses: actions/upload-artifact@v4
        with:
          name: ExploreFilter-debug
          path: ExploreFilter-debug.dylib
          compression-level: 0

      - name: Upload release dylib
        uses: actions/upload-artifact@v4
        with:
          name: ExploreFilter-release
          path: ExploreFilter-release.dylib
          compression-level: 0
